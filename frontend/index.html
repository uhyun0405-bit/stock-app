<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>나의 주식 메모장</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    
    /* 제목 줄 디자인 */
    .header-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 60px; gap: 15px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 16px; }
    
    /* 각 종목 줄 디자인 */
    .stock-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 60px; gap: 15px; margin-bottom: 20px; align-items: center; }
    
    /* 굵은 테두리 박스 (사진 요청사항 반영) */
    .box { border: 3px solid black; padding: 15px 5px; text-align: center; height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 15px; background: white;}
    
    /* 입력창 디자인 */
    input { width: 90%; border: none; text-align: center; outline: none; font-size: 15px; font-weight: bold; }
    
    /* 색상 */
    .profit { color: red; font-weight: bold; }
    .loss { color: blue; font-weight: bold; }
    
    /* 버튼 */
    .btn { cursor: pointer; border: none; font-weight: bold; }
    .refresh-btn { background: #007bff; color: white; padding: 15px 0; border-radius: 5px; }
    #add-btn { background: #28a745; color: white; margin-top: 10px; padding: 15px 30px; font-size: 16px; border-radius: 5px; width: 100%; }
    
    .stock-name { font-size: 12px; color: gray; margin-bottom: 3px; }
  </style>
</head>
<body>
  <h2>📝 나의 주식 메모장</h2>
  
  <div class="header-row">
    <div>종목 (코드)</div>
    <div>내 금액</div>
    <div>현재가</div>
    <div>비고 (+/-)</div>
    <div></div>
  </div>

  <!-- 여기에 주식 목록이 계속 추가됩니다 -->
  <div id="stock-list"></div>

  <button id="add-btn" class="btn">+ 종목 추가하기</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
